workflows:
  taiz-express-android-workflow:
    name: Taiz Express Android Workflow
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Deep Clean and Get Dependencies
        script: |
          flutter clean
          rm -rf android/.gradle
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
