workflows:
  taiz-express-android-workflow:
    name: Taiz Express Android Workflow
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Recreate Android with SDK 34
        script: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdk/compileSdk = 34/g' android/app/build.gradle
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
