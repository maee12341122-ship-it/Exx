
name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. تثبيت Flutter Stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. إنشاء مجلد Android فقط إذا لم يكن موجوداً
      - name: Prepare Android Project
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=taiz_express
          fi

          # ضبط إصدارات SDK لتتوافق مع إصدار Flutter الحالي
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E \
              -e 's/^[[:space:]]*compileSdk = .*/    compileSdk = flutter.compileSdkVersion/' \
              -e 's/^[[:space:]]*minSdk = .*/    minSdk = flutter.minSdkVersion/' \
              -e 's/^[[:space:]]*targetSdk = .*/    targetSdk = flutter.targetSdkVersion/' \
              android/app/build.gradle.kts

          elif [ -f android/app/build.gradle ]; then
            sed -i -E \
              -e 's/^[[:space:]]*compileSdkVersion .*/    compileSdkVersion flutter.compileSdkVersion/' \
              -e 's/^[[:space:]]*minSdkVersion .*/    minSdkVersion flutter.minSdkVersion/' \
              -e 's/^[[:space:]]*targetSdkVersion .*/    targetSdkVersion flutter.targetSdkVersion/' \
              android/app/build.gradle
          else
            echo "ERROR: Android Gradle app file not found!"
            exit 1
          fi

      # 5. فحص بيئة البناء
      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version
          flutter doctor -v

      # 6. تنظيف الملفات المؤقتة
      - name: Clean Project
        run: flutter clean

      # 7. تحميل المكتبات
      - name: Get Dependencies
        run: flutter pub get

      # 8. بناء APK
      - name: Build Release APK
        run: flutter build apk --release --verbose

      # 9. رفع ملف APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taiz-Express-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
